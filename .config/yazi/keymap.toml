[[mgr.prepend_keymap]]
on   = "<C-r>"
run  = "plugin open-with-cmd -- block"
desc = "Open with command in the terminal"

[[mgr.prepend_keymap]]
on   = "O"
run  = "plugin open-with-cmd"
desc = "Open with command"

[[mgr.prepend_keymap]]
on = "<C-n>"
run = "shell -- dragon-drop --and-exit -x -i -T %h"
desc = "Drag hovered file"
